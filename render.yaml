services:
  - type: web
    name: pulse-music-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
